name: ${COMPOSE_PROJECT_NAME:-tongji_v3}

services:
  api:
    build:
      context: ../..
      dockerfile: apps/v3-api/Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - private
      - supabase
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4310/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 160

  web:
    build:
      context: ../..
      dockerfile: apps/v3-local/Dockerfile
      args:
        VITE_APP_MODE: production
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TONGJI_V3_PORT:-8300}:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - private
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 80

networks:
  private:
    driver: bridge
  supabase:
    external: true
    name: ${SUPABASE_NETWORK:-supabase_default}
