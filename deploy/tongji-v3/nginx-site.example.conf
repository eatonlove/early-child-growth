server {
    listen 80;
    server_name tongji.meidaquan.com;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/tongji.meidaquan.com;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tongji.meidaquan.com;

    ssl_certificate /etc/letsencrypt/live/tongji.meidaquan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tongji.meidaquan.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TongjiSSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /www/wwwlogs/tongji.meidaquan.com.log;
    error_log /www/wwwlogs/tongji.meidaquan.com.error.log warn;

    client_max_body_size 110m;

    location / {
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}
